<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background badge -->
  <rect width="64" height="64" rx="16" fill="#5A5A40"/>
  
  <!-- Subtle golden inner ring -->
  <circle cx="32" cy="32" r="28" stroke="#D1CEC7" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  
  <!-- Family Tree Vector Graphic -->
  <!-- Roots -->
  <path d="M32 52V40" stroke="#F5F2ED" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32 50C27 52 22 53 18 54" stroke="#D1CEC7" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 50C37 52 42 53 46 54" stroke="#D1CEC7" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Main Trunk & Branches -->
  <path d="M32 40C32 34 22 30 20 23" stroke="#F5F2ED" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 40C32 34 42 30 44 23" stroke="#F5F2ED" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 40V20" stroke="#F5F2ED" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Branch splits -->
  <path d="M25 32C20 30 15 28 14 22" stroke="#E5E2D9" stroke-width="2" stroke-linecap="round"/>
  <path d="M39 32C44 30 49 28 50 22" stroke="#E5E2D9" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Nodes / Leaves (Generations) -->
  <!-- Top Center Root Ancestor / Core Node -->
  <circle cx="32" cy="16" r="4.5" fill="#A65D47" stroke="#FDFBF7" stroke-width="1.5"/>
  
  <!-- Top Left & Right Nodes -->
  <circle cx="20" cy="20" r="3.8" fill="#FDFBF7" stroke="#5A5A40" stroke-width="1.5"/>
  <circle cx="44" cy="20" r="3.8" fill="#FDFBF7" stroke="#5A5A40" stroke-width="1.5"/>
  
  <!-- Outer Nodes -->
  <circle cx="13" cy="22" r="3" fill="#A65D47" stroke="#FDFBF7" stroke-width="1"/>
  <circle cx="51" cy="22" r="3" fill="#A65D47" stroke="#FDFBF7" stroke-width="1"/>
  
  <!-- Tiny generational connection points -->
  <circle cx="26" cy="26" r="2.2" fill="#E5E2D9"/>
  <circle cx="38" cy="26" r="2.2" fill="#E5E2D9"/>
</svg>
